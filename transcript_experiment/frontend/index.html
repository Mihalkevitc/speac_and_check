<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Speak and Check — Прототип</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        button { padding: 12px 24px; font-size: 16px; margin: 5px; cursor: pointer; }
        #status { margin: 20px 0; color: #666; }
        #result { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 8px; white-space: pre-wrap; }

        #dropZone {
            margin-top: 20px;
            padding: 30px;
            border: 2px dashed #aaa;
            border-radius: 10px;
            text-align: center;
            color: #666;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        #dropZone.dragover { background: #eef6ff; border-color: #3b82f6; color: #1e3a8a; }
        #dropZone.loading { opacity: 0.6; pointer-events: none; }
        #fileInput { display: none; }
    </style>
</head>
<body>
    <h1>Speak and Check</h1>
    <p>Запишите голос или перетащите готовый аудиофайл.</p>

    <div>
        <button id="recordBtn">🎤 Записать</button>
        <button id="stopBtn" disabled>⏹ Стоп и отправить</button>
    </div>

    <div id="dropZone">
        <div>📁 Перетащите аудиофайл сюда</div>
        <div style="font-size: 13px; margin-top: 6px;">или нажмите, чтобы выбрать</div>
        <input type="file" id="fileInput" accept="audio/*">
    </div>

    <div id="status"></div>
    <div id="result"></div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let stream;

        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        // -------- общая функция отправки на сервер --------
        async function sendAudio(blob, filename) {
            statusDiv.textContent = "Отправка на сервер...";
            resultDiv.textContent = "";

            const formData = new FormData();
            formData.append('file', blob, filename);

            const t0 = performance.now();

            try {
                const response = await fetch('http://localhost:8000/transcribe', {
                    method: 'POST',
                    body: formData
                });

                const t1 = performance.now();
                const clientTime = ((t1 - t0) / 1000).toFixed(2);

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Ошибка сервера');
                }

                const data = await response.json();
                const t = data.timings || {};
                const f = data.fluency || {};

                resultDiv.textContent =
                    `Транскрипт:\n\n${data.text}\n\n` +
                    `Аудио: ${data.duration} сек | Файл: ${data.size_kb} KB\n` +
                    `Сохранено как: ${data.saved_as}\n\n` +
                    `Беглость речи:\n` +
                    `  слов: ${f.words_count ?? '?'}\n` +
                    `  скорость: ${f.words_per_minute ?? '?'} слов/мин\n` +
                    `  паузы > 0.5 с: ${f.pauses_count ?? '?'} (суммарно ${f.pauses_total_s ?? '?'} с)\n` +
                    `  средняя пауза: ${f.avg_pause_s ?? '?'} с\n\n` +
                    `Тайминги (сервер):\n` +
                    `  сохранение: ${t.save_ms ?? '?'} мс\n` +
                    `  транскрибация: ${t.transcribe_s ?? '?'} с\n` +
                    `  всего на сервере: ${t.total_s ?? '?'} с\n` +
                    `Клиент (от клика до ответа): ${clientTime} с`;

                statusDiv.textContent = "Готово!";
            } catch (error) {
                resultDiv.textContent = "Ошибка: " + error.message;
                statusDiv.textContent = "";
            }
        }

        // -------- запись с микрофона --------
        recordBtn.onclick = async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(track => track.stop());
                    stopBtn.disabled = true;

                    const mime = mediaRecorder.mimeType || 'audio/webm';
                    let ext = 'webm';
                    if (mime.includes('mp4')) ext = 'mp4';
                    else if (mime.includes('ogg')) ext = 'ogg';

                    const audioBlob = new Blob(audioChunks, { type: mime });
                    await sendAudio(audioBlob, `recording.${ext}`);
                    recordBtn.disabled = false;
                };

                mediaRecorder.start();
                recordBtn.disabled = true;
                stopBtn.disabled = false;
                statusDiv.textContent = "🔴 Идёт запись...";
                resultDiv.textContent = "";

            } catch (error) {
                statusDiv.textContent = "Не удалось получить доступ к микрофону: " + error.message;
            }
        };

        stopBtn.onclick = () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                statusDiv.textContent = "Обработка...";
            }
        };

        // -------- drag-and-drop --------
        dropZone.onclick = () => fileInput.click();

        fileInput.onchange = () => {
            if (fileInput.files.length > 0) {
                handleFile(fileInput.files[0]);
            }
        };

        ['dragenter', 'dragover'].forEach(evt => {
            dropZone.addEventListener(evt, e => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, e => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('dragover');
            });
        });

        dropZone.addEventListener('drop', e => {
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        async function handleFile(file) {
            if (!file.type.startsWith('audio/')) {
                statusDiv.textContent = "Это не аудиофайл: " + file.name;
                return;
            }
            dropZone.classList.add('loading');
            dropZone.querySelector('div').textContent = "⏳ Обработка: " + file.name;
            await sendAudio(file, file.name);
            dropZone.classList.remove('loading');
            dropZone.querySelector('div').textContent = "📁 Перетащите аудиофайл сюда";
        }
    </script>
</body>
</html>
